name: Deploy

# A merge to `test` deploys the test environment (https://test.kristofferrisa.no).
# Prod is deployed only by promote.yml. One short job, no install step:
# wrangler runs through npx at a pinned version. Docs-only changes do not deploy.
on:
  push:
    branches: [test]
    paths:
      - "site/**"
      - "wrangler.jsonc"
      - ".github/workflows/deploy.yml"
  workflow_dispatch:

concurrency:
  group: deploy-test
  cancel-in-progress: true

permissions:
  contents: read

env:
  WRANGLER: wrangler@4.158.0

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    environment:
      name: test
      url: https://test.kristofferrisa.no
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
    steps:
      - if: github.ref_name != 'test'
        run: echo "::error::Test deploys run from the test branch, not $GITHUB_REF_NAME" && exit 1
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Keep the test site out of search engines
        run: printf '\n/*\n  X-Robots-Tag: noindex, nofollow\n' >> site/_headers

      - name: Deploy
        run: npx --yes "$WRANGLER" deploy --env test

      - name: Verify
        run: |
          for i in 1 2 3 4 5 6; do
            curl -fsS https://test.kristofferrisa.no/ | grep -q 'Kristoffer Risa' && curl -fsSI https://test.kristofferrisa.no/en/ >/dev/null && exit 0
            sleep 5
          done
          echo "::error::https://test.kristofferrisa.no did not answer"; exit 1
